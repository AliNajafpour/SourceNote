name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build:windows
      - name: Calculate release checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/SourceNote-Windows.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SourceNote-Windows.zip" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: SourceNote-Windows
          path: |
            dist/SourceNote-Windows.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: SourceNote-Windows
          path: release
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          release/SourceNote-Windows.zip release/SHA256SUMS.txt
          --verify-tag --title "SourceNote $RELEASE_TAG"
          --notes "Download SourceNote-Windows.zip, extract the entire archive, and open SourceNote.exe. See the repository README for requirements, usage, and backup instructions."
          --generate-notes
